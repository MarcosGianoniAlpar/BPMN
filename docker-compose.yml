# Auto-hospedagem do servidor Node. NAO e o deploy em uso (esse e o Vercel);
# ver o Dockerfile para o porque de existir.
services:
  bpmn:
    build: .
    image: bpmn-pipeline
    container_name: bpmn-pipeline
    # Sempre religa (após crash ou reboot da máquina), mas não se você parar de propósito.
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
    # Lê ANTHROPIC_API_KEY, DATABASE_URL e os limites de uso do .env (o mesmo
    # arquivo do CLI). Sem DATABASE_URL o servidor não sobe: o estado (projetos,
    # versões, contador de uso) vive no Postgres, não em disco local.
    env_file:
      - .env
